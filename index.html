<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jerry's AI Blog</title>
  <style>
    :root {
      --bg-color: #000;
      --text-color: #fff;
      --subtext-color: #ccc;
      --link-color: #66ccff;
      --link-hover: #3399cc;
    }

    body.light {
      --bg-color: #f0f0f0;
      --text-color: #111;
      --subtext-color: #444;
      --link-color: #007acc;
      --link-hover: #005f99;
    }

    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      position: relative;
      transition: background 0.5s, color 0.5s;
    }

    .stars {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background: transparent;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    h1, p, nav, footer, .controls {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 2rem;
      color: var(--subtext-color);
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: var(--link-color);
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--link-hover);
    }

    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
      color: #888;
    }

    .controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
    }

    .controls button {
      margin-left: 10px;
      padding: 6px 10px;
      background: transparent;
      border: 1px solid var(--text-color);
      color: var(--text-color);
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s;
    }

    .controls button:hover {
      background: var(--text-color);
      color: var(--bg-color);
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="controls">
    <button id="langToggle">中文</button>
    <button id="themeToggle">☀️</button>
  </div>

  <h1 data-en="Hello, You can call me Jerry" data-zh="你好，我是 Jerry">Hello, You can call me Jerry</h1>
  <p data-en="Welcome to my personal website! I'm an AI enthusiast, focused on exploring artificial intelligence, machine learning, and cutting-edge technologies." 
     data-zh="欢迎来到我的个人网站！我是一名 AI 爱好者，专注于人工智能、机器学习与前沿技术的探索。">
     Welcome to my personal website! I'm an AI enthusiast, focused on exploring artificial intelligence, machine learning, and cutting-edge technologies.
  </p>
  <nav>
    <a href="#" data-en="Document" data-zh="博客">Document</a>
    <a href="#" data-en="About me" data-zh="关于我">About me</a>
    <a href="https://github.com/你的GitHub账号" target="_blank">GitHub</a>
  </nav>

  <footer data-en="© 2025 Jerry's AI website" data-zh="© 2025 Jerry 的 AI 网站">
    © 2025 Jerry's AI website
  </footer>

  <script>
    // 星星生成
    const starContainer = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.top = `${Math.random() * 100}%`;
      star.style.left = `${Math.random() * 100}%`;
      star.style.animationDuration = `${1 + Math.random() * 3}s`;
      starContainer.appendChild(star);
    }

    // 中英文切换
    const langToggle = document.getElementById('langToggle');
    let isEnglish = true;
    langToggle.addEventListener('click', () => {
      isEnglish = !isEnglish;
      langToggle.textContent = isEnglish ? '中文' : 'English';

      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute(isEnglish ? 'data-en' : 'data-zh');
      });
    });

    // 黑白主题切换
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      themeToggle.textContent = document.body.classList.contains('light') ? '🌙' : '☀️';
    });
  </script>
</body>
</html>
