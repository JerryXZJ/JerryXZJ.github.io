<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的博客</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background-color: #ffffff;
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 2rem;
      color: #555;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #007acc;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #005f99;
    }

    footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>你好，我是 Jerry</h1>
  <p>欢迎来到我的技术博客，这里记录我的开发笔记与学习心得。</p>
  <nav>
    <a href="#">博客</a>
    <a href="#">关于我</a>
    <a href="https://github.com/你的GitHub账号" target="_blank">GitHub</a>
  </nav>

  <footer>© 2025 Jerry 的博客</footer>
</body>
</html>
